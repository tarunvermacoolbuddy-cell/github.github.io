<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abhishek & Shivani | MIKAVIA</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 25px 15px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Georgia, serif;
  background: linear-gradient(145deg, #fff5f4, #f3dce1, #fff8ee);
  color: #76513d;
}

.card {
  width: 100%;
  max-width: 450px;
  padding: 40px 22px 25px;
  text-align: center;
  border: 1px solid #c6a15c;
  border-radius: 18px;
  background: rgba(255,255,255,0.72);
  box-shadow: 0 10px 40px #9d777733;
  animation: appear 1.5s ease both;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(-35px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.quote {
  color: #a77b49;
  font-size: 16px;
  line-height: 1.7;
  letter-spacing: 1px;
}

h1 {
  font-size: 36px;
  font-weight: normal;
  line-height: 1.3;
  color: #a77b49;
  margin: 25px 0;
}

.date {
  color: #a17b5a;
  font-size: 14px;
  letter-spacing: 3px;
}

.line {
  width: 65px;
  border-top: 1px solid #c6a15c;
  margin: 25px auto;
}

.message {
  font-size: 18px;
  line-height: 1.8;
}

.footer {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  text-align: left;
  gap: 12px;
  border-top: 1px solid #d9bd8b;
  padding-top: 18px;
  margin-top: 30px;
  font-family: Arial, sans-serif;
  font-size: 12px;
  line-height: 1.6;
}

.left {
  flex: 1;
}

.right {
  flex: 1;
  text-align: right;
  font-weight: bold;
  color: #9c7445;
}

.brand {
  color: #a77b49;
  font-weight: bold;
  letter-spacing: 1px;
}
</style>
</head>

<body>

<div class="card">

  <div class="quote">
    A beautiful celebration becomes unforgettable
    because of the people who share it with us.
  </div>

  <h1>
    Abhishek<br>&<br>Shivani
  </h1>

  <div class="date">
    5 DECEMBER 2026
  </div>

  <div class="line"></div>

  <p class="message">
    Your presence makes our celebration more beautiful.
    <br><br>
    Thank you for being a part of our special day!
  </p>

  <div class="footer">

    <div class="left">
      Made Memorable with
      <div class="brand">MIKAVIA</div>
      8950168357
    </div>

    <div class="right">
      SUNDER TENT HOUSE
    </div>

  </div>

</div>

</body>
</html
