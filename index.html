<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abhishek & Shivani | MIKAVYA</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
font-family:Georgia,serif;
background:linear-gradient(145deg,#fff5f4,#f5dce0,#fff8ee);
color:#76513d;
padding:20px;
}
.card{
max-width:450px;
width:100%;
padding:45px 25px;
border:1px solid #c6a15c;
border-radius:18px;
background:rgba(255,255,255,.65);
box-shadow:0 10px 40px #9d777733;
animation:appear 2s ease;
}
@keyframes appear{
from{opacity:0;transform:translateY(20px)}
to{opacity:1;transform:translateY(0)}
}
.top{color:#b18a43;letter-spacing:5px;font-size:13px}
h1{font-size:36px;color:#a77b49;font-weight:normal}
.heart{color:#c98291;font-size:28px}
.date{letter-spacing:3px;font-size:14px;color:#a17b5a}
.line{width:65px;border-top:1px solid #c6a15c;margin:25px auto}
.message{font-size:18px;line-height:1.8}
.footer{margin-top:35px;color:#b18a43;letter-spacing:3px;font-size:13px}
</style>
</head>
<body>
<div class="card">
<div class="top">YOU ARE CORDIALLY INVITED</div>
<div class="heart">♥️</div>
<p>THE WEDDING CELEBRATION OF</p>
<h1>Abhishek<br>&<br>Shivani</h1>
<div class="date">5 DECEMBER 2026</div>
<div class="line"></div>
<p class="message">
Your presence makes our celebration more beautiful.
<br><br>
Thank you for being a part of our special day!
</p>
<div class="line"></div>
<div class="footer">WITH LOVE · MIKAVIA</div>
</div>
</body>
</html>
